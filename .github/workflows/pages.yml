name: Deploy to GitHub Pages

on:
  push:
    branches: [ branch/default ]   # or your default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install build tools for Glazer
        run: sudo apt-get update && sudo apt-get install -y build-essential
        shell: bash

      - name: Setup Glazer
        run: pwsh ./tools/setup-glazer.ps1
        shell: bash

      - name: Restore
        run: dotnet restore Zilf.sln

      - name: Run tests
        run: dotnet test Zilf.sln --no-restore --logger "console;verbosity=minimal"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Zilf.sln

      - name: Publish site
        run: dotnet publish src/Zilf.Playground -c Release -o public --nologo

      - name: Build ZilfPub
        run: dotnet build src/ZilfPub -c Release --no-restore --nologo

      - name: Publish Advent site
        working-directory: sample/advent
        run: dotnet ../../bin/Release/net10.0/zilf.dll publish advent.zil --publish-output ../../public/wwwroot/advent

      - name: Publish Cloak site
        working-directory: sample/cloak
        run: dotnet ../../bin/Release/net10.0/zilf.dll publish cloak.zil --publish-output ../../public/wwwroot/cloak

      - name: Publish Rascal site
        working-directory: sample/rascal
        run: dotnet ../../bin/Release/net10.0/zilf.dll publish rascal.zil --publish-output ../../public/wwwroot/rascal

      - name: Prepare Pages artifact
        run: |
          touch public/.nojekyll
          # echo "your.custom.domain" > public/CNAME   # if using a custom domain
          cp public/wwwroot/index.html public/wwwroot/404.html   # all URLs should serve the SPA

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/wwwroot

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
