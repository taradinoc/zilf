name: Deploy to GitHub Pages

on:
  push:
    branches: [ branch/default ]   # or your default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Zilf.sln

      - name: Run tests
        run: dotnet test Zilf.sln --no-restore --logger "console;verbosity=minimal"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Zilf.sln

      - name: Publish site
        run: dotnet publish src/Zilf.Playground -c Release -o public --nologo

      - name: Prepare Pages artifact
        run: |
          touch public/.nojekyll
          # echo "your.custom.domain" > public/CNAME   # if using a custom domain
          cp public/wwwroot/index.html public/wwwroot/404.html   # all URLs should serve the SPA

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/wwwroot

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
