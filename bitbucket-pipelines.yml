# TODO: run zillib tests

image: microsoft/dotnet:sdk

pipelines:
  default:
    - step:
        caches:
          - dotnetcore
        script:
          #- dotnet test Zilf.sln    # TODO: re-enable once tests work on Linux
          - "dotnet msbuild -t:PackageAllRids -p:Configuration=Release Build.proj"
        artifacts:
          - Package/*/Packages/*