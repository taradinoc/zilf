<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta property="og:type" content="website">

    <meta property="og:url" content="https://zilf.io/">

    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="ZILF">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="ZILF">
    <meta name="twitter:description" content="Compiler and tools for the Zork Implementation Language. Download ZILF or use the online playground.">
    <meta name="twitter:image" content="https://zilf.io/zilf-logo.png">
    <meta name="twitter:image:alt" content="ZILF logo">
    <meta name="robots" content="index,follow">

    <!-- Canonical + Favicon -->
    <link rel="canonical" href="https://zilf.io/">
    <link rel="icon" href="/favicon.ico">

    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="Zilf.Playground.styles.css" rel="stylesheet" />

</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="loading-content">
                <img src="zilf-logo-transparent.png" alt="ZILF Logo" class="loading-logo" />
                <div class="loading-spinner">
                    <div class="spinner-border text-light" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <p class="loading-text">Loading...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <!-- JS/.NET interop -->
    <script src="./interop.js"></script>

    <!-- Monaco -->
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
    
    <!-- ZIL language definition for Monaco -->
    <script src="./zil-language.js"></script>

    <!-- Blazor framework -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
